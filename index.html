<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabula — CSV Editor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236c8cff'/%3E%3Cpath d='M8 10h16v2H8zM8 15h10v2H8zM8 20h13v2H8z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- ======= Top bar: brand + filename ======= -->
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="7" fill="url(#g)"/>
            <path d="M8 10h16v2H8zM8 15h10v2H8zM8 20h13v2H8z" fill="white"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32">
              <stop stop-color="#83a5ff"/><stop offset="1" stop-color="#5b7cfa"/>
            </linearGradient></defs>
          </svg>
        </span>
        <span class="brand-name">Tabula</span>
        <span class="brand-tag">CSV&nbsp;Editor</span>
      </div>

      <div class="file-identity">
        <input id="filename" class="filename" type="text" value="untitled.csv" spellcheck="false"
               title="File name (used for export)" />
        <span id="dot" class="dirty-dot" title="Unsaved changes" hidden></span>
      </div>

      <div class="top-actions">
        <label class="btn" title="Open a .csv file from disk">
          Open
          <input id="fileInput" type="file" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values,text/plain" hidden />
        </label>
        <button id="btnExport" class="btn btn-primary" title="Download as CSV (Ctrl+S)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Export</span>
        </button>
      </div>
    </header>

    <!-- ======= Toolbar: actions + search ======= -->
    <div class="toolbar">
      <div class="tools">
        <button id="btnUndo" class="btn" title="Undo (Ctrl+Z)" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
          <span>Undo</span>
        </button>
        <button id="btnRedo" class="btn" title="Redo (Ctrl+Shift+Z)" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
          <span>Redo</span>
        </button>
        <span class="sep"></span>
        <button id="btnPaste" class="btn" title="Paste CSV data from clipboard as the whole grid">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
          <span>Paste…</span>
        </button>
        <button id="btnNew" class="btn" title="Start a new empty grid">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          <span>New</span>
        </button>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" class="search" type="text" placeholder="Search rows…" spellcheck="false" />
        <button id="searchClear" class="search-clear" title="Clear search (Esc)" hidden>×</button>
      </div>
    </div>

    <!-- ======= Grid ======= -->
    <div id="dropzone">
      <div id="scroller" class="scroller">
        <table class="grid" role="grid" aria-label="CSV grid">
          <thead id="head"></thead>
          <tbody id="body">
            <tr id="padTop" class="pad" aria-hidden="true"><td style="width:100%"></td></tr>
          </tbody>
        </table>
      </div>

      <!-- Empty state -->
      <div id="empty" class="empty" hidden>
        <svg width="72" height="72" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="4" y="6" width="24" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/>
          <path d="M9 13h14M9 17h9" stroke="currentColor" stroke-width="1.5" opacity=".35" stroke-linecap="round"/>
          <rect x="17" y="17" width="7" height="7" rx="1.5" fill="#5b7cfa"/>
          <path d="M20.5 20.5l3-3m0 3l-3-3" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <h2>No data yet</h2>
        <p>Open a CSV file, paste data, or drag &amp; drop a file here.</p>
        <div class="empty-actions">
          <button id="btnSample" class="btn btn-primary">Load sample data</button>
          <button id="btnEmptyOpen" class="btn">Open file…</button>
        </div>
        <div class="empty-foot">Tabula · a private CSV editor that never leaves your browser</div>
      </div>

      <!-- Drag overlay -->
      <div id="dragOverlay" class="drag-overlay" hidden>
        <div class="drag-box">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <p>Drop CSV to load</p>
        </div>
      </div>
    </div>

    <!-- ======= Status bar ======= -->
    <footer class="statusbar">
      <div class="status-left">
        <span id="statCounts" class="stat mono">—</span>
        <span id="statSort" class="stat" hidden></span>
        <span id="statSearch" class="stat" hidden></span>
      </div>
      <div class="status-right">
        <span class="stat mono kbd-hints">
          <kbd>Enter</kbd> commit &amp; go down · <kbd>Esc</kbd> cancel · <kbd>Ctrl+Z</kbd> undo
        </span>
      </div>
    </footer>

    <!-- ======= Toast ======= -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- ======= Confirm modal ======= -->
  <div id="modalRoot" class="modal-root" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <div class="modal-actions">
        <button id="modalCancel" class="btn">Cancel</button>
        <button id="modalOk" class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
